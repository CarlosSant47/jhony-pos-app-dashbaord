<c-row class="ticket-page">
  <c-col xs="12" class="ticket-page-column">
    <c-card class="ticket-card">
      <c-card-header class="d-flex align-items-center flex-wrap gap-2">
        <strong>Plantillas de Ticket</strong>
      </c-card-header>
      <c-card-body class="ticket-card-body">
        <c-tabs class="ticket-tabs" [activeItemKey]="'ticket-templates'" (activeItemKeyChange)="handleChange($event)">
          <c-tabs-list variant="tabs">
            <button cTab itemKey="ticket-templates">Plantilla de Ticket</button>
            <button cTab itemKey="ticket-sell-point">Plantilla de Ticket Punto de Venta</button>
            <button cTab itemKey="ticket-preview">Vista previa de impresión</button>
          </c-tabs-list>
          <c-tabs-content class="ticket-tabs-content">
            <c-tab-panel class="p-3" itemKey="ticket-templates">
              <app-ticket-template-list></app-ticket-template-list>
            </c-tab-panel>
            <c-tab-panel class="p-3" itemKey="ticket-sell-point">
              <app-ticket-template-sell-point></app-ticket-template-sell-point>
            </c-tab-panel>
            <c-tab-panel class="p-3 ticket-preview-panel" itemKey="ticket-preview">
              <app-ticket-preview></app-ticket-preview>
            </c-tab-panel>
          </c-tabs-content>
        </c-tabs>
      </c-card-body>
    </c-card>
  </c-col>
</c-row>
